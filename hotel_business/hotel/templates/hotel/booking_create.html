{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Новое бронирование</title>
    <link rel="stylesheet" href="{% static 'hotel/css/style.css' %}">
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo">Новое бронирование</div>
            <div class="nav">
                <a href="{% url 'home' %}">Главная</a>
                <a href="{% url 'booking_list' %}">Назад</a>
                <a href="{% url 'logout' %}">Выйти</a>
            </div>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Создание бронирования</h2>

        <div class="form-container">
            <div class="form-card">
                <form>
                    <div class="form-group">
                        <label>Номер:</label>
                        <select name="room">
                            <option value="1">101 - Стандарт</option>
                            <option value="2">102 - Стандарт</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Заезд:</label>
                        <input type="date" name="arrival_date">
                    </div>

                    <div class="form-group">
                        <label>Выезд:</label>
                        <input type="date" name="departure_date">
                    </div>

                    <button type="button" class="submit-btn" onclick="alert('Форма пока не работает!')">Забронировать</button>
                </form>
            </div>

            <div class="back-link">
                <a href="{% url 'booking_list' %}">← Назад</a>
            </div>
        </div>
    </div>
</body>
</html>
